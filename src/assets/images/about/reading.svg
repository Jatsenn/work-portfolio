<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset="1" stop-color="#f0edff"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7c6fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c6fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.74"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="b"/>
      <feOffset in="b" dx="0" dy="22" result="o"/>
      <feColorMatrix in="o" type="matrix"
        values="0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0 0.14  0 0 0 0.18 0" result="s"/>
      <feMerge>
        <feMergeNode in="s"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <g filter="url(#soft)" transform="translate(180 140)">
    <rect x="0" y="0" width="840" height="520" rx="44" fill="url(#card)"/>
    <rect x="0" y="0" width="840" height="520" rx="44" fill="none" stroke="#d9d5e9" stroke-opacity="0.7"/>

    <!-- Minimal open book -->
    <g transform="translate(165 120)">
      <path d="M0 68c0-18 14-32 32-32h250c44 0 84 16 114 44l10 10v256l-20-14c-28-20-62-30-96-30H32c-18 0-32-14-32-32V68z"
            fill="#1f1f2e" opacity="0.92"/>
      <path d="M510 68c0-18-14-32-32-32H228c-44 0-84 16-114 44l-10 10v256l20-14c28-20 62-30 96-30h258c18 0 32-14 32-32V68z"
            fill="#2b2b44" opacity="0.92"/>
      <path d="M250 88h140" stroke="#7c6fff" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
      <path d="M250 132h200" stroke="#7c6fff" stroke-width="10" stroke-linecap="round" opacity="0.22"/>
      <path d="M250 176h176" stroke="#7c6fff" stroke-width="10" stroke-linecap="round" opacity="0.16"/>
    </g>

    <g transform="translate(52 412)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
      <text x="0" y="0" font-size="22" letter-spacing="6" fill="#6c677a">READING</text>
      <text x="0" y="34" font-size="16" letter-spacing="2" fill="#8a8696">Depth • Ideas • Calm</text>
    </g>
  </g>
</svg>
