<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7ff"/>
      <stop offset="1" stop-color="#efeaff"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7c6fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c6fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.76"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="b"/>
      <feOffset in="b" dx="0" dy="22" result="o"/>
      <feColorMatrix in="o" type="matrix"
        values="0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0 0.14  0 0 0 0.18 0" result="s"/>
      <feMerge>
        <feMergeNode in="s"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- Minimal “boxing glove” silhouette -->
  <g filter="url(#soft)" transform="translate(180 140)">
    <rect x="0" y="0" width="840" height="520" rx="44" fill="url(#card)"/>
    <rect x="0" y="0" width="840" height="520" rx="44" fill="none" stroke="#d9d5e9" stroke-opacity="0.7"/>

    <g transform="translate(150 96)">
      <path d="M220 92c0-56 46-92 104-92h70c52 0 92 42 92 94v76c0 36-18 70-48 90l-62 40c-18 12-40 18-62 18h-94c-48 0-86-38-86-86V92z"
            fill="#1f1f2e" opacity="0.90"/>
      <path d="M96 210c0-42 34-76 76-76h120c30 0 54 24 54 54v146c0 40-32 72-72 72H190c-52 0-94-42-94-94V210z"
            fill="#2b2b44" opacity="0.95"/>
      <rect x="164" y="354" width="256" height="58" rx="18" fill="#7c6fff" opacity="0.20"/>
      <rect x="164" y="364" width="214" height="10" rx="999" fill="#7c6fff" opacity="0.35"/>
    </g>

    <g transform="translate(52 412)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
      <text x="0" y="0" font-size="22" letter-spacing="6" fill="#6c677a">BOXING</text>
      <text x="0" y="34" font-size="16" letter-spacing="2" fill="#8a8696">Discipline • Focus • Craft</text>
    </g>
  </g>
</svg>
